<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Círculo externo preto -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="#1a1a1a" stroke-width="30"/>
  
  <!-- Círculo interno laranja -->
  <circle cx="150" cy="150" r="110" fill="#FF9900" stroke="none"/>
  
  <!-- Porco/pimenta com chama no centro -->
  <g transform="translate(150, 90)">
    <!-- Chama -->
    <path d="M 0 0 Q -3 5 -3 10 Q -3 16 0 18 Q 3 16 3 10 Q 3 5 0 0 Z" 
          fill="#FF6600" stroke="#1a1a1a" stroke-width="1"/>
    <path d="M -5 8 Q -7 12 -7 16 Q -7 22 0 25 Q 7 22 7 16 Q 7 12 5 8" 
          fill="#FF9900" stroke="#1a1a1a" stroke-width="1"/>
    
    <!-- Cabeça porco -->
    <circle cx="0" cy="35" r="8" fill="#C9B4A8" stroke="#1a1a1a" stroke-width="1.5"/>
    
    <!-- Orelhas -->
    <ellipse cx="-6" cy="30" rx="3" ry="5" fill="#C9B4A8" stroke="#1a1a1a" stroke-width="1"/>
    <ellipse cx="6" cy="30" rx="3" ry="5" fill="#C9B4A8" stroke="#1a1a1a" stroke-width="1"/>
    
    <!-- Olhos -->
    <circle cx="-3" cy="33" r="1" fill="#1a1a1a"/>
    <circle cx="3" cy="33" r="1" fill="#1a1a1a"/>
    
    <!-- Focinho -->
    <ellipse cx="0" cy="37" rx="2.5" ry="1.5" fill="#A89080" stroke="#1a1a1a" stroke-width="0.8"/>
    <circle cx="-1" cy="37" r="0.4" fill="#1a1a1a"/>
    <circle cx="1" cy="37" r="0.4" fill="#1a1a1a"/>
  </g>
  
  <!-- Texto "Francis" no topo -->
  <text x="150" y="240" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    Francis
  </text>
  
  <!-- Anos no círculo externo -->
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FF9900" text-anchor="middle">
    2025
  </text>
  
  <!-- Texto "Creative Kitchen" no rodapé -->
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#1a1a1a" text-anchor="middle">
    Creative Kitchen
  </text>
</svg>
